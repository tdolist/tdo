name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tdo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tdo
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tdo
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tdo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tdo.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build -p tdo-cli --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p tdo-cli --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} \
             dist/tdo-${{ matrix.target }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: tdo-${{ matrix.target }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
