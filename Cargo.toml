[workspace]
members = ["crates/tdo-core", "crates/tdo"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Felix Wittwer <dev@felixwittwer.de>", "Felix Döring <development@felixdoering.com>"]
repository = "https://github.com/tdolist/tdo"
license = "MIT"
keywords = ["todo", "tdo", "terminal"]

[workspace.dependencies]
tdo-core = { path = "crates/tdo-core" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
comfy-table = "7"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
