[workspace]
members = [".", "crates/tdo-core", "crates/tdo-export"]
resolver = "2"


[package] 
name = "tdo"
version = "2.2.0"
edition = "2021"
authors = ["Felix Wittwer <dev@felixwittwer.de>", "Felix Döring <development@felixdoering.com>"]
description = "A todo list tool for the terminal."

repository = "https://github.com/tdolist/tdo-rs"

license = "MIT"
keywords = ["todo", "tdo", "tdolist", "terminal"]
readme = "README.md"

include = ["Cargo.toml", "Cargo.lock", "src/*"]

[[bin]]
name = "tdo"
path = "src/main.rs"

[dependencies]
clap = {version = "2.23.1", features = ["yaml"]}
tdo-core = { path = "crates/tdo-core" }
tdo-export  = { path = "crates/tdo-export" }
colored = "3.1.1"
