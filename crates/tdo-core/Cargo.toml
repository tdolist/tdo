[package]
name = "tdo-core"
version = "0.1.0"
edition = "2021"
authors = ["Felix Döring <development@felixdoering.com>", "Felix Wittwer <dev@felixwittwer.de>"]
description = "The core domain logic for tdo"
repository = "https://github.com/h4llow3En/tdo"
license = "MIT"
keywords = ["todo", "tdo", "terminal"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
